<link rel="stylesheet" href="{{ paldaca_embed_css }}">
<script>
  (function () {
    "use strict";

    var CONFIGURED_PORTAL = "{{ paldaca_nav_portal_url|escapejs }}";
    var APP = "{{ paldaca_nav_current_app|escapejs }}";

    // Red de seguridad puramente visual: si por lo que sea el servidor nos
    // marco como embebidos pero no lo estamos, no tocamos nada.
    if (window.self === window.top) return;
    document.documentElement.classList.add("paldaca-embedded");

    // Origen REAL del shell. Si usamos solo la config y el usuario abre el
    // Portal en 127.0.0.1 vs localhost (o www vs apex), postMessage se descarta
    // en silencio y el shell queda en modo degradado ("¿No ves el contenido?").
    function portalOrigin() {
      try {
        if (location.ancestorOrigins && location.ancestorOrigins.length > 0) {
          return location.ancestorOrigins[0];
        }
      } catch (e) { /* Safari privado / Firefox sin ancestorOrigins */ }
      try {
        if (document.referrer) {
          return new URL(document.referrer).origin;
        }
      } catch (e) { /* referrer opaco */ }
      try {
        return new URL(CONFIGURED_PORTAL).origin;
      } catch (e) {
        return CONFIGURED_PORTAL;
      }
    }

    function send(payload) {
      try {
        window.parent.postMessage(
          Object.assign({ v: 1, source: "paldaca-embed", app: APP }, payload),
          portalOrigin()
        );
      } catch (e) {
        /* El shell no esta alcanzable: nada que avisar. */
      }
    }

    function currentPath() {
      var url = new URL(window.location.href);
      url.searchParams.delete("paldaca_embed");
      var q = url.searchParams.toString();
      return url.pathname + (q ? "?" + q : "") + url.hash;
    }

    function sendReady() {
      send({ type: "ready", path: currentPath(), title: document.title });
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", sendReady, { once: true });
    } else {
      sendReady();
    }

    var CANCEL_LOADING_MS = 8000;
    var notified = false;
    function notifyLoading() {
      if (notified) return;
      notified = true;
      send({ type: "loading" });
      window.setTimeout(function () {
        notified = false;
        sendReady();
      }, CANCEL_LOADING_MS);
    }

    document.addEventListener(
      "click",
      function (event) {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

        var link = event.target && event.target.closest ? event.target.closest("a") : null;
        if (!link || !link.href) return;
        if (link.target && link.target !== "_self") return;
        if (link.hasAttribute("download")) return;

        var url;
        try {
          url = new URL(link.href, window.location.href);
        } catch (e) {
          return;
        }
        if (url.origin !== window.location.origin) return;
        if (url.pathname === window.location.pathname && url.search === window.location.search) return;
        if (url.protocol !== "http:" && url.protocol !== "https:") return;

        window.setTimeout(function () {
          if (event.defaultPrevented) return;
          notifyLoading();
        }, 0);
      },
      true
    );

    document.addEventListener(
      "submit",
      function (event) {
        window.setTimeout(function () {
          if (event.defaultPrevented) return;
          notifyLoading();
        }, 0);
      },
      true
    );

    window.addEventListener("beforeunload", notifyLoading);
  })();
</script>
